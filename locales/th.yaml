    "corrupt": "ตานี้ถูกหยุดเพราะฐานข้อมูลสถานะรายงานว่าเสียหายเชิงโครงสร้าง (บทสนทนาจะหายไปถ้ารีสตาร์ต) ลบที่ว่างในดิสก์ไม่ช่วยนะ ทางแก้กู้คืน:\n1. รัน `hermes {profile_arg}doctor --fix`\n2. หยุดเกตเวย์ แล้วกู้คืนด้วย:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (ถ้ารายงานว่ากู้ได้) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — การกู้คืนจะสแนปช็อตไฟล์ที่เสียหายก่อน อย่ารัน `sqlite3 ... \".recover\"` กับ state.db ตัวจริงที่ใช้งานอยู่เด็ดขาด เพราะ sqlite3 CLI ที่มีช่องโหว่อาจทำให้พังหนักขึ้นไปอีก\n3. กู้คืนจากแบ็กอัปใน {backups_dir}/\nแล้วส่งข้อความอีกครั้ง"
    "default": "Hermes บันทึกบทสนทนานี้ไม่ได้ จึงหยุดไว้ก่อนดีกว่าทำข้อความของมุงหาย สาเหตุที่เป็นไปได้: ดิสก์เต็ม หรือมีโปรเซส Hermes อื่นถือฐานข้อมูลไว้อยู่ ปิดหน้าต่าง Hermes อื่นก่อน แล้วรัน `hermes {profile_arg}doctor` เพื่อเช็กพื้นที่เก็บข้อมูล จากนั้นส่งข้อความอีกครั้ง"
    "deleted_wal": "มีโปรเซส Hermes อื่นยังถือสำเนาเก่าของ write-ahead log ของฐานข้อมูลเซสชันไว้ Hermes จึงหยุดเขียนเพื่อรักษาไฟล์ให้ปลอดภัย และข้อความนี้ไม่ถูกบันทึก (มีสำเนาเก็บไว้ที่ {home}/sessions/) ไม่มีอะไรหายไปนะ ปิดโปรเซส Hermes ทุกตัวในโปรไฟล์นี้ (แอป Desktop, `hermes {profile_arg}gateway stop`, แดชบอร์ด, cron) รัน `hermes {profile_arg}doctor` — มันจะบอกชื่อโปรเซสที่ยังถือ log ไว้ — แล้วเปิด Hermes ใหม่และส่งข้อความอีกครั้ง อย่ารัน `doctor --fix` หรือลบไฟล์ state.db ใดๆ ตอนที่มันกำลังทำงาน คู่มือ: {recovery_docs}"
    "disk": "Hermes บันทึกบทสนทนานี้ลงดิสก์ไม่ได้ จึงหยุดไว้ก่อนดีกว่าทำข้อความของมุงหาย ดิสก์น่าจะเต็ม: เคลียร์พื้นที่หน่อย (หรือแก้สิทธิ์ของ {home}/state.db) แล้วส่งข้อความอีกครั้ง"
    "fts_index": "ตานี้ถูกหยุดเพราะดัชนีค้นหาเซสชัน (FTS5) เสียหายและถอดออกไม่ได้ ข้อความนี้จึงไม่ถูกบันทึก ตัวที่เก็บข้อความเองไม่ได้เสียหาย: อย่ารันตัวกู้คืนหรือกู้แบ็กอัปนะ รัน `hermes {profile_arg}doctor --fix` (หรือรีสตาร์ต Hermes ซึ่งจะซ่อมดัชนีให้เองตอนเปิด) แล้วส่งข้อความอีกครั้ง"
    "locked": "ตานี้ถูกหยุดเพราะที่เก็บเซสชันกำลังไม่ว่าง (มีโปรเซส Hermes อื่นกำลังเขียนฐานข้อมูลสถานะอยู่) ข้อความของมุงควรถูกบันทึกไว้แล้ว — ส่งอีกทีในอีกสักครู่"
    "replaced": "ไฟล์ฐานข้อมูลเซสชันถูกแทนที่ตอนที่ Hermes กำลังรันอยู่ ข้อความนี้จึงไม่ถูกบันทึก (มีสำเนาเก็บไว้ที่ {home}/sessions/) หยุด Hermes ก่อน (`hermes {profile_arg}gateway stop`) รัน `hermes {profile_arg}doctor` — ไม่ใช่ `hermes {profile_arg}doctor --fix` ซึ่งจะไปซ่อมไฟล์ผิดตัวแทน — แล้วเปิดใหม่และส่งข้อความอีกครั้ง ขั้นตอนกู้คืนแบบละเอียดอยู่ในล็อก"
    "session_row_missing": "เซสชันนี้ถูกลบออกจากที่เก็บข้อมูลตอนที่แชทยังเปิดอยู่ และ Hermes สร้างใหม่ไม่ได้ ข้อความนี้จึงไม่ถูกบันทึก ส่งข้อความอีกครั้ง ถ้ายังพังอยู่ให้รัน `hermes {profile_arg}doctor`"
