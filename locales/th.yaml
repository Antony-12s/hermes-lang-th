"tips":
  "placeholder":
    "p01": "ถามไรก็ได้ หรือพิมพ์ / เพื่อดูคำสั่งมา จะเขินทำไม…"
    "p02": "สรุปว่ามีอะไรอยู่ในโฟลเดอร์นี้บ้าง"
    "p03": "ร่างคำตอบให้อีเมลล่าสุดในอินบ็อกซ์ของฉัน"
    "p04": "วางแผนฟีเจอร์แล้วค่อยสร้างทีละขั้น"
    "p05": "หาและแก้เทสต์ที่พัง"
    "p06": "ค้นคว้าเรื่องนี้แล้วเขียนบรีฟให้ฉัน"
    "p07": "รีโปนี้เปลี่ยนอะไรไปบ้างช่วงนี้?"
    "p08": "แปลงโน้ตนี้เป็นลิสต์สิ่งที่ต้องทำ"
    "p09": "อธิบายข้อผิดพลาดนี้และวิธีแก้"
    "p10": "ตั้งการแจ้งเตือนหรือกำหนดเวลางานซ้ำ"
    "p11": "พิมพ์ / ไล่ดูคำสั่ง หรือกด Ctrl+P เปิดพาเลตไปเลยจ้า"
  "t001": "/bg <พรอมต์> โยนงานไปรันเซสชันแยก ปล่อยเซสชันปัจจุบันของมุงว่างต่อไป; /btw <คำถาม> แทรกถามเรื่องเสริมได้โดยไม่ยุ่งงานหลัก"
  "t002": "/branch แยกเซสชันปัจจุบันออกไปอีกสาย ลองทางแปลกๆได้ไม่ต้องกลัวพังของเก่า"
  "t003": "/compress มือเองบี้คอนเท็กซ์บทสนทนาให้แบนตอนมันยาวจนจะล้นจอ"
  "t004": "/rollback โชว์ checkpoint ของไฟล์ทั้งหมด — ย้อนไฟล์ที่เอเจนต์แก้กลับไปเวอร์ชันไหนก็ได้ ของมันดีจริง"
  "t005": "/rollback diff 2 แอบดูว่าเปลี่ยนอะไรไปตั้งแต่ checkpoint 2 โดยไม่ต้องย้อนคืนอะไรเลยนะจ๊ะ"
  "t006": "/rollback 2 src/file.py ย้อนคืนไฟล์เดียวจาก checkpoint ที่ระบุ จัดให้ตรงจุด"
  "t007": "/title \"my project\" ตั้งชื่อเซสชันให้โก้ — จะเล่นต่อทีหลังก็ใช้ /resume หรือ hermes -c ได้เลย"
  "t008": "/resume ลากมุงกลับไปต่อจากเซสชันที่ตั้งชื่อไว้ก่อนหน้า เหมือนไม่เคยหายไปไหน"
  "t009": "/queue <prompt> จองคิวข้อความไว้รอบถัดไป ไม่ไปแทรกรอบปัจจุบันให้วุ่นวาย"
  "t010": "/undo เผาการโต้ตอบล่าสุดระหว่างมุงกับเอเจนต์ออกจากบทสนทนาทิ้งไปเลย"
  "t011": "/retry ส่งข้อความล่าสุดของมุงใหม่อีกที — เผื่อเอเจนต์ตอบมางงๆไม่เข้าท่า"
  "t012": "/verbose หมุนโหมดโชว์ความคืบหน้าทูล: off → new → all → verbose เลือกเอาตามใจ"
  "t013": "/reasoning high อัดความลึกของการคิดให้โมเดลหนักขึ้น /reasoning show แฉความคิดให้ดูเลย"
  "t014": "/fast สลับ priority processing เร่งคำตอบ API ให้ไวขึ้น (แล้วแต่ผู้ให้บริการจะใจดีแค่ไหน)"
  "t015": "/yolo ข้ามการขออนุมัติคำสั่งอันตรายทั้งหมดไปเลย เสี่ยงเอาเองนะมุง"
  "t016": "/model สลับโมเดลกลางเซสชันได้ง่ายๆ — ลอง /model sonnet หรือ /model gpt-5 ดูสิ"
  "t017": "/model --global เปลี่ยนโมเดลเริ่มต้นของมุงแบบถาวร คิดดีๆก่อนกดนะ"
  "t018": "/personality pirate ใส่บุคลิกสนุกๆให้เอเจนต์ — มีให้เลือก 14 แบบตั้งแต่ kawaii ถึง shakespeare เลือกไปวะ"
  "t019": "/skin เปลี่ยนธีม CLI ให้ฉ่ำ — ลอง ares, mono, slate, poseidon หรือ charizard ดู"
  "t020": "/statusbar สลับแถบค้างโชว์โมเดล, โทเคน, % คอนเท็กซ์เต็ม, ค่าใช้จ่าย และเวลาที่ใช้ ครบจบในบรรทัดเดียว"
  "t021": "/tools disable browser ปิดทูลเบราว์เซอร์ชั่วคราวสำหรับเซสชันนี้ หายใจโล่งไปก่อน"
  "t022": "/browser connect ลากทูลเบราว์เซอร์ไปเกาะเบราว์เซอร์ตระกูล Chromium ที่รันอยู่ผ่าน CDP"
  "t023": "/plugins แสดงลิสต์ปลั๊กอินที่ติดตั้งและสถานะมัน ดูได้ชัดๆ"
  "t024": "/cron จัดการงานตามกำหนด — ตั้งพรอมต์ซ้ำๆ แล้วส่งไปแพลตฟอร์มไหนก็ได้ตามใจมุง"
  "t025": "/reload-mcp โหลดคอนฟิก MCP server ใหม่แบบ hot-reload ไม่ต้องรีสตาร์ทให้เมื่อย"
  "t026": "/usage แฉการใช้โทเคน, ค่าใช้จ่ายแยกรายการ และเวลาเซสชันให้ดูหมด"
  "t027": "/insights แสดงสถิติการใช้งานของ 30 วันล่าสุด ย้อนดูกันชัดๆ"
  "t028": "/paste สอดส่องคลิปบอร์ดว่ามีรูปแอบซ่อนไหม แล้วแนบไปกับข้อความถัดไปให้เลย"
  "t029": "/profile แสดงโปรไฟล์ที่ใช้งานอยู่และไดเรกทอรีโฮมของมัน จะหลงทางก็มาเช็กได้"
  "t030": "/config แสดงคอนฟิกปัจจุบันแบบคร่าวๆ ให้ดูชิลๆ"
  "t031": "/stop ฆ่าโปรเซสพื้นหลังทั้งหมดที่เอเจนต์สร้างไว้ จบเกมให้หมด"
  "t032": "@file:path/to/file.py แทรกเนื้อไฟล์เข้าไปในข้อความตรงๆ ไม่ต้องก๊อปให้เมื่อย"
  "t033": "@file:main.py:10-50 แทรกแค่บรรทัด 10-50 ของไฟล์ ชัดเจนไม่เยอะ"
  "t034": "@folder:src/ แทรกรายการโครงสร้างไดเรกทอรีให้ดูทั้งต้นไม้"
  "t035": "@diff แทรกการเปลี่ยนแปลง git ที่ยังไม่ stage เข้าไปในข้อความ จะซ่อนก็ไม่ได้"
  "t036": "@staged แทรกการเปลี่ยนแปลงที่ stage ไว้แล้ว (git diff --staged) ครบเหมือนเดิม"
  "t037": "@git:5 แทรก 5 คอมมิตล่าสุดพร้อม patch เต็มๆ อ่านให้เมื่อยไปเลย"
  "t038": "@url:https://example.com ไปดึงเนื้อหาหน้าเว็บมาแทรกให้ ขี้เกียจเปิดเองก็ใช้นี่"
  "t039": "พิมพ์ @ แล้วมันจะเติมพาธไฟล์ให้อัตโนมัติ — เลือกไฟล์ไหนก็ได้แบบอินเทอร์แอกทีฟ ง่ายจึ้ง"
  "t040": "รวมการอ้างอิงหลายอันทีเดียวได้: \"ช่วยรีวิว @file:main.py และ @file:test.py ว่าตรงกันไหม\""
  "t041": "Alt+Enter แทรกบรรทัดใหม่สำหรับพิมพ์หลายบรรทัด (Windows Terminal มันแอบดักจับ Alt+Enter ไว้เอง — ใช้ Ctrl+Enter แทนเถอะ)"
  "t042": "Ctrl+C แทรกเบรกเอเจนต์กลางคัน กดซ้ำสองทีใน 2 วินาทีถ้าอยากออกแบบด่วน"
  "t043": "Ctrl+Z ยัด Hermes ลงพื้นหลังไปซะ — รัน fg ใน shell เพื่อลากกลับมาต่อ"
  "t044": "Tab กดรับคำแนะนำ ghost text หรือเติมคำสั่งสแลชให้สมบูรณ์แบบขี้เกียจพิมพ์"
  "t045": "พิมพ์ข้อความใหม่ตอนเอเจนต์กำลังขมักเขม้นทำงาน เพื่อแทรกแซงเปลี่ยนทิศมันได้เลย"
  "t046": "Alt+V วางรูปจากคลิปบอร์ดลงบทสนทนาแบบไม่ต้องลาก"
  "t047": "วางข้อความ 5+ บรรทัดเข้าไป มันจะเซฟลงไฟล์ให้อัตโนมัติ แล้วแทรกลิงก์สั้นๆแทนความยาวเยอะ"
  "t048": "hermes -c ลากกลับไปเล่นเซสชัน CLI ล่าสุด hermes -c \"project name\" เล่นต่อตามชื่อที่ตั้งไว้"
  "t049": "hermes -w สร้าง git worktree แยกอิสระให้ — เหมาะกับรันเอเจนต์หลายตัวพร้อมกันแบบไม่ตีกัน"
  "t050": "hermes -w -q \"Fix issue #42\" รวม worktree แยกอิสระกับคำสั่ง one-shot ยิงทีเดียวจบ"
  "t051": "hermes chat -t web,terminal เปิดแค่ทูลเซ็ตที่ระบุ ไม่พกของเกินจำเป็น"
  "t052": "hermes chat -s github-pr-workflow โหลดสกิลล่วงหน้าให้ตั้งแต่เริ่ม ไม่ต้องรอ"
  "t053": "hermes chat -q \"query\" รันคำถามเดียวแบบไม่อินเทอร์แอกทีฟแล้วดับจอจบงาน"
  "t054": "hermes chat --max-turns 1000 ปรับลิมิตเริ่มต้น 500 รอบต่อเทิร์นให้โหดขึ้น"
  "t055": "hermes chat --checkpoints เปิดถ่าย snapshot ไฟล์ก่อนการเปลี่ยนแปลงที่ทำลายข้อมูลทุกครั้ง กันพังไว้ก่อน"
  "t056": "hermes --yolo ข้ามการขออนุมัติคำสั่งอันตรายทั้งหมดไปทั้งเซสชัน เสี่ยงดวงเอาเอง"
  "t057": "hermes chat --source telegram แท็กเซสชันไว้ให้กรองง่ายใน hermes sessions list"
  "t058": "hermes -p work chat รันด้วยโปรไฟล์ที่ระบุโดยไม่แตะค่าเริ่มต้นของมุงเลย"
  "t059": "hermes doctor --fix จะวินิจฉัยและซ่อมปัญหาคอนฟิก/dependency ให้แบบอัตโนมัติ ไม่ต้องมุงนั่งงมเอง 555"
  "t060": "hermes dump โชว์สรุปการตั้งค่าแบบกระชับ — เอาไปแปะในรายงานบั๊กได้เลย จัดไป"
  "t061": "hermes config set KEY VALUE ส่ง secret ไป .env อัตโนมัติ ส่วนที่เหลือโยนไป config.yaml ฉลาดกว่ามุงอีก"
  "t062": "hermes config edit เปิด config.yaml ในเอดิเตอร์เริ่มต้นของมุง ไปแก้เอาดิ"
  "t063": "hermes config check สแกนหาค่าคอนฟิกที่ขาดหรือเก่าไป เผื่อมุงลืมไปแล้ว"
  "t064": "hermes sessions browse เปิดตัวเลือกเซสชันแบบอินเทอร์แอกทีฟพร้อมค้นหา จะมุงจะกรูก็หาเจอ"
  "t065": "hermes sessions stats แสดงจำนวนเซสชันแยกตามแพลตฟอร์มและขนาดฐานข้อมูล เผื่ออยากรู้ว่าแชทกับกรูไปกี่รอบแล้ว"
  "t066": "hermes sessions prune --older-than 30 เก็บกวาดเซสชันเก่าให้สะอาด เคลียร์อดีตซะ อย่าหาทำแบกไว้ทำไม"
  "t067": "hermes skills search react --source skills-sh ค้นหาในไดเรกทอรีสาธารณะ skills.sh จัดไป"
  "t068": "hermes skills check สแกนสกิลจาก hub ที่ติดตั้งไว้ว่ามีอัปเดตใหม่ไหม เผื่อสกิลมุงตึงๆไปแล้ว"
  "t069": "hermes skills tap add myorg/skills-repo เพิ่มแหล่งสกิล GitHub ของตัวเอง จะปังหรือจะพังก็ลองดู"
  "t070": "hermes skills snapshot export setup.json ส่งออกคอนฟิกสกิลไว้สำรองหรือแชร์ กันพังแล้วร้องหาแม่"
  "t071": "hermes mcp add github --command npx เพิ่ม MCP server จากคอมมานด์ไลน์ ง่ายจนมุงไม่มีข้อแก้ตัว"
  "t072": "hermes mcp-serve รัน Hermes เองในฐานะ MCP server ให้เอเจนต์อื่นเรียกใช้ แบ่งปันบ้างก็ดีนะเว้ย"
  "t073": "hermes auth add ให้มุงเพิ่ม API key หลายตัวสำหรับวนใช้ credential pool เผื่อตัวนึงโดนรัดก่อน"
  "t074": "hermes completion bash >> ~/.bashrc เปิดการเติมคำสั่งด้วย Tab สำหรับทุกคำสั่งและโปรไฟล์ เร็วขึ้นแบบเกินต้าน"
  "t075": "hermes logs -f ตาม agent.log แบบเรียลไทม์ --level WARNING --since 1h กรองผลลัพธ์ให้ดูเนียนๆ"
  "t076": "hermes backup สร้างไฟล์ zip สำรองไดเรกทอรีโฮมของ Hermes ทั้งหมด เผื่อมุงพลาดมือลบเองวันหลัง"
  "t077": "hermes profile create coder สร้างโปรไฟล์แยกอิสระที่กลายเป็นคำสั่งของตัวเอง จัดให้ดั่งใจมุง"
  "t078": "hermes profile create work --clone คัดลอกคอนฟิกและคีย์ปัจจุบันไปโปรไฟล์ใหม่ ไม่ต้องตั้งซ้ำให้เมื่อย"
  "t079": "hermes update ซิงก์สกิลที่แพ็กมาใหม่ไปทุกโปรไฟล์โดยอัตโนมัติ ขี้เกียจทำมือก็มีกรูคอยทำแทน"
  "t080": "hermes gateway install ตั้ง Hermes เป็น system service (systemd/launchd) ให้มันรันแบบจึ้งๆตลอดไป"
  "t081": "hermes memory setup ให้มุงตั้งค่าผู้ให้บริการความจำภายนอกได้ (Honcho, Mem0 ฯลฯ) เผื่อสมองกรูจำไม่พอ"
  "t082": "hermes webhook subscribe สร้างเส้นทาง webhook แบบ event-driven พร้อมตรวจสอบ HMAC กันของปลอมมาแกง"
  "t083": "ประหยัดเงิน: hermes tools ปิดทูลที่ไม่ได้ใช้, hermes skills config ตัดสกิลให้เล็กลง กระเป๋ามุงจะขอบใจ"
  "t084": "/reasoning low หรือ /reasoning minimal ลดความลึกการคิดจากค่าเริ่มต้น (medium) — เร็วขึ้น ถูกลง แต่กรูยังฉลาดเหมือนเดิมนะ"
  "t085": "hermes models ส่งงานวิชัน, อัดบทสนทนา, และงานเสริมไปโมเดลที่ถูกกว่า — ลดค่าโทเคนพื้นหลัง 85%+ โดยไม่ต้องลดระดับโมเดลหลักที่คุยด้วย เซฟเงินแบบฉ่ำๆ"
  "t086": "ตั้ง display.bell_on_complete: true ใน config.yaml เพื่อได้ยินเสียงบี๊บตอนงานยาวเสร็จ เผื่อมุงหลับรอจนลืมไปแล้ว"
  "t087": "ตั้ง display.streaming: true เพื่อเห็นโทเคนทยอยโผล่มาแบบเรียลไทม์ตอนโมเดลสร้างคำตอบ ดูกรูคิดสดๆซะ"
  "t088": "ตั้ง display.show_reasoning: true เพื่อดูการคิดแบบ chain-of-thought ของโมเดล แฉความคิดในหัวกรูให้มุงดู"
  "t089": "ตั้ง display.compact: true เพื่อลดช่องว่างในผลลัพธ์ให้ข้อมูลแน่นขึ้น ตึงๆแบบไม่มีที่เหลือ"
  "t090": "ตั้ง display.busy_input_mode: queue เพื่อคิวข้อความแทนการแทรกเอเจนต์ หรือ steer เพื่อแทรกกลางงานผ่าน /steer แล้วแต่มุงจะใจร้อนแค่ไหน"
  "t091": "ตั้ง display.resume_display: minimal เพื่อข้ามการสรุปบทสนทนาเต็มตอนเล่นเซสชันต่อ ไม่ต้องรื้ออดีตทุกครั้งก็ได้"
  "t092": "ตั้ง compression.threshold: 0.50 เพื่อควบคุมจังหวะที่การอัดอัตโนมัติจะยิง (ค่าเริ่มต้น: 50% ของคอนเท็กซ์) ก่อนสมองกรูจะแตก"
  "t093": "ตั้ง agent.max_turns: 1000 เพื่อให้เอเจนต์เรียกทูลได้มากขึ้นต่อเทิร์น ปล่อยกรูวิ่งยาวๆไปเลย"
  "t094": "ตั้ง file_read_max_chars: 200000 เพื่อเพิ่มเนื้อหาสูงสุดต่อการเรียก read_file อ่านจุกๆไปทีเดียว"
  "t095": "ตั้ง approvals.mode: smart ให้ LLM อนุมัติคำสั่งปลอดภัยและไม่อนุมัติคำสั่งอันตรายให้อัตโนมัติ ฉลาดกว่ามุงตอนครึ่งหลับ"
  "t096": "ตั้ง fallback_model ใน config.yaml เพื่อสลับไปผู้ให้บริการสำรองอัตโนมัติเมื่อล้ม กันแกงตอนโมเดลหลักดับกะทันหัน"
  "t097": "ตั้ง privacy.redact_pii: true เพื่อแฮช user ID และเบอร์โทรก่อนส่งไปโมเดล กันข้อมูลมุงหลุดไปแกงที่อื่น"
  "t098": "ตั้ง browser.headed: true ไว้ แล้วจะเห็นหน้าต่าง Chromium โลคอลตอนเอเจนต์ไถเว็บ อยากแอบดูก็ทำได้นะจ๊ะ"
  "t099": "ตั้ง worktree: true ใน config.yaml เพื่อสร้าง git worktree เสมอ (เหมือน hermes -w) ขี้เกียจพิมพ์แฟล็กซ้ำก็ตั้งทิ้งไว้เลย"
  "t100": "ตั้ง security.website_blocklist.enabled: true เพื่อบล็อกโดเมนเฉพาะจากทูลเว็บ กันกรูหลงไปเว็บแกงๆ"
  "t101": "ตั้ง cron.wrap_response: false เพื่อส่งผลลัพธ์ดิบของเอเจนต์โดยไม่มี header/footer ของ cron ตึงๆไม่ต้องมีเปลือก"
  "t102": "HERMES_TIMEZONE ปรับเขตเวลาเซิร์ฟเวอร์ด้วยรหัสเขตเวลา IANA ไหนก็ได้ จะอยู่โซนไหนของโลกก็ไม่หนีกรู"
  "t103": "แทนค่าตัวแปรสภาพแวดล้อมได้ใน config.yaml: ใช้รูปแบบ ${VAR_NAME} ง่ายจนไม่มีข้อแก้ตัวให้แฮร์ดโค้ด"
  "t104": "คำสั่งลัดใน config.yaml รันคำสั่ง shell ทันทีโดยไม่ใช้โทเคนเลย ฟรีจึ้งๆ ไม่มีแกงเงิน"
  "t105": "บุคลิกแบบกำหนดเองสร้างได้ใน config.yaml ภายใต้ agent.personalities อยากให้กรูกวนตีนกว่านี้ก็ไปปรับเอาดิ"
  "t106": "provider_routing ควบคุมการจัดเรียง, ไวต์ลิสต์, แบล็กลิสต์ผู้ให้บริการของ OpenRouter เลือกข้างให้ชัดไปเลยมุง"
  "t107": "execute_code รันสคริปต์ Python ที่เรียกทูล Hermes แบบโปรแกรม — ผลลัพธ์ไม่เข้าคอนเท็กซ์ กรูทำงานเงียบๆให้มุง"
  "t108": "delegate_task สปอว์นซับเอเจนต์ได้สูงสุด 10 ตัวพร้อมกันตามค่าเริ่มต้น (delegation.max_concurrent_children) พร้อมคอนเท็กซ์แยกอิสระสำหรับงานพาราเลล จะได้แกงหลายหม้อพร้อมกัน"
  "t109": "web_extract ใช้กับ URL ของ PDF ได้ — ส่งลิงก์ PDF ไปแล้วมันแปลงเป็น markdown ให้ ไม่ต้องก้มหน้าอ่านเองให้ตาแฉะ"
  "t110": "search_files ใช้ ripgrep เบื้องหลัง เร็วกว่า grep — ใช้แทน terminal grep ได้เลย เร็วแบบเกินต้าน"
  "t111": "patch ใช้กลยุทธ์จับคู่แบบ fuzzy 9 แบบ เลยไม่พังเพราะช่องว่างต่างกันเล็กน้อย ใจกว้างกว่ามุงตอนเช็กโค้ดอีก"
  "t112": "patch รองรับฟอร์แมต V4A สำหรับแก้ไขหลายไฟล์รวดเดียว จัดไปทีเดียวจบ ไม่ต้องรันทีละไฟล์ให้เมื่อย"
  "t113": "read_file แนะนำชื่อไฟล์ที่คล้ายกันเมื่อหาไฟล์ไม่เจอ ใจดีกว่ามุงตอนพิมพ์ชื่อไฟล์ผิดอีก"
  "t114": "read_file ลดข้อมูลซ้ำให้อัตโนมัติ — อ่านไฟล์เดิมที่ไม่เปลี่ยนซ้ำจะได้แค่ stub เบาๆ ไม่เปลืองคอนเท็กซ์เหมือนมุงเปลืองเวลา"
  "t115": "ตั้ง browser.user_data_dir เป็นโฟลเดอร์ไหนก็ได้ เพื่อเก็บโปรไฟล์ Chromium ถาวร ล็อกอินเว็บจะไม่หายทุกรอบ ขี้เกียจล็อกอินซ้ำใช่มั้ยล่ะ"
  "t116": "browser.chromium_args ใส่แฟลก Chromium เพิ่มให้เซสชันเบราว์เซอร์โลคอลได้ เช่น --lang=de อยากเปลี่ยนภาษาก็ลุยเลย"
  "t117": "image_generate สร้างภาพด้วย FLUX 2 Pro พร้อมอัปสเกล 2 เท่าอัตโนมัติ ปังปุริเย่แบบไม่ต้องขอ"
  "t118": "text_to_speech แปลงข้อความเป็นเสียง — เล่นเป็น voice bubble บน Telegram ให้กรูพูดแทนมุงได้เลย"
  "t119": "send_message ส่งถึงแพลตฟอร์มแชทที่เชื่อมต่อไว้ได้จากในเซสชัน ยิงข้ามแพลตฟอร์มแบบไม่ง้อมุง"
  "t120": "ทูล todo ช่วยให้เอเจนต์ติดตามงานหลายขั้นตอนซับซ้อนระหว่างเซสชัน เผื่อสมองกรูก็หลงทางได้เหมือนกัน"
  "t121": "session_search ค้นหาแบบ full-text ข้ามบทสนทนาที่ผ่านมาทั้งหมด ขุดของเก่าได้ลึกกว่ามุงขุดอดีตแฟนอีก"
  "t122": "เอเจนต์บันทึกค่าที่ชอบ, การแก้ไข, และข้อเท็จจริงเกี่ยวกับสภาพแวดล้อมลงความจำให้อัตโนมัติ จำแม่นกว่ามุงจำวันเกิดใครอีก"
  "t123": "/moa ส่งพรอมต์ยากๆ หนึ่งอันผ่านชุดโมเดล Mixture of Agents ที่ตั้งไว้ ยากแค่ไหนก็ส่งให้แก๊งนี้ลุยแทนมุง"
  "t124": "คำสั่ง terminal รองรับโหมดพื้นหลังพร้อม notify_on_complete สำหรับงานที่ใช้เวลานาน ปล่อยมันรันแล้วไปกินข้าวก่อนก็ได้"
  "t125": "โปรเซสพื้นหลังของ terminal รองรับ watch_patterns เพื่อเตือนเมื่อมีผลลัพธ์บรรทัดที่กำหนด ไม่ต้องมุงนั่งจ้องจอรอ"
  "t126": "ทูล terminal รองรับ 6 backend: local, Docker, SSH, Modal, Daytona, และ Singularity เลือกได้ตามใจแกงมุง"
  "t127": "ทุกโปรไฟล์มีคอนฟิก, API key, ความจำ, เซสชัน, สกิล, และงาน cron ของตัวเอง แยกกันชัดเหมือนมุงกับกรู"
  "t128": "ชื่อโปรไฟล์กลายเป็นคำสั่ง shell — 'hermes profile create coder' สร้างคำสั่ง 'coder' ตั้งชื่อเท่ๆได้ตามใจเลย"
  "t129": "hermes profile export coder -o backup.tar.gz สร้างไฟล์สำรองโปรไฟล์แบบพกพาได้ เอาติดตัวไปได้ทุกที่"
  "t130": "ถ้าสองโปรไฟล์ใช้ bot token ชนกันโดยไม่ตั้งใจ เกตเวย์ที่สองจะถูกบล็อกพร้อมข้อความชัดเจน กันแกงกันเองโดยไม่รู้ตัว"
  "t131": "เซสชันสร้างชื่อเรื่องให้เองหลังโต้ตอบครั้งแรก — ไม่ต้องตั้งชื่อมือเอง ขี้เกียจตั้งชื่อก็ให้กรูคิดแทน"
  "t132": "ชื่อเซสชันรองรับสายตระกูล: \"my project\" → \"my project #2\" → \"my project #3\" เหมือนนับรุ่นลูกหลานไปเรื่อยๆ"
  "t133": "ตอนออก Hermes จะพิมพ์คำสั่งเล่นต่อพร้อม session ID และสถิติ จำไม่ได้ก็มีกรูเตือนให้"
  "t134": "hermes sessions export backup.jsonl ส่งออกทุกเซสชันไว้สำรองหรือวิเคราะห์ เก็บหลักฐานไว้เผื่อมุงเถียงกรูทีหลัง"
  "t135": "hermes -r SESSION_ID เล่นต่อเซสชันเก่าเฉพาะอันใดอันหนึ่งด้วย ID ของมัน ย้อนอดีตได้ตามสั่ง"
  "t136": "ความจำเป็น snapshot แบบแช่แข็ง — การเปลี่ยนแปลงจะโผล่ใน system prompt ตอนเริ่มเซสชันถัดไปเท่านั้น ใจเย็นๆรอรอบหน้า"
  "t137": "ข้อมูลในความจำถูกสแกนหา prompt injection และการพยายามขโมยข้อมูลโดยอัตโนมัติ กันของแปลกปลอมมาแกงหัวกรู"
  "t138": "เอเจนต์มีที่เก็บความจำสองแบบ: โน้ตส่วนตัว (~2200 ตัวอักษร) และโปรไฟล์ผู้ใช้ (~1375 ตัวอักษร) จำมุงได้แน่นกว่าที่คิด"
  "t139": "การแก้ไขที่มุงบอกเอเจนต์ (\"ไม่ใช่ ทำแบบนี้แทน\") มักถูกบันทึกลงความจำให้อัตโนมัติ ด่ากรูครั้งเดียวกรูจำได้ตลอด"
  "t140": "มีสกิลที่แพ็กมากว่า 80 ตัว ครอบคลุม github, งานสร้างสรรค์, mlops, productivity, งานวิจัย และอีกเพียบ จัดเต็มจนมุงเลือกไม่ถูก"
  "t141": "สกิลที่ติดตั้งทุกตัวจะกลายเป็นคำสั่งสแลชอัตโนมัติ — พิมพ์ / เพื่อดูทั้งหมด ง่ายกว่ามุงจำสูตรอาหารอีก"
  "t142": "hermes skills install official/security/1password ติดตั้งสกิลเสริมจาก repo จัดไปอีกตัวก็ไม่เสียเงิน"
  "t143": "สกิลบางตัวจำกัดเฉพาะ OS ได้ — บางตัวโหลดแค่บน macOS หรือ Linux เท่านั้น เลือกข้างเหมือนมุงเลือกค่าย"
  "t144": "skills.external_dirs ใน config.yaml ให้มุงโหลดสกิลจากไดเรกทอรีกำหนดเองได้ อยากปั้นเองก็ได้เลยไม่ง้อ"
  "t145": "เอเจนต์สร้างสกิลของตัวเองเป็นความจำเชิงกระบวนการได้โดยใช้ skill_manage กรูสอนตัวเองได้ด้วยนะเออ"
  "t146": "/plan เขียนแผนการทำงานแบบ markdown ลงที่ .hermes/plans/ โดยไม่รันอะไรจริง แค่วางแผนก่อน ยังไม่ลงมือแกงจริง"
  "t147": "งาน cron แนบสกิลได้: hermes cron add --skill blogwatcher \"เช็กโพสต์ใหม่\" ตั้งแล้วลืมได้เลยมุง"
  "t148": "เป้าหมายส่งของ cron มี telegram, discord, slack, email, sms, และอีกกว่า 12 แพลตฟอร์ม ยิงได้ทั่วจักรวาลแชทมุง"
  "t149": "ถ้าคำตอบ cron ขึ้นต้นด้วย [SILENT] การส่งจะถูกระงับ — มีประโยชน์สำหรับงานที่แค่มอนิเตอร์ เงียบๆทำงานไม่ต้องป่าวประกาศ"
  "t150": "Cron รองรับดีเลย์แบบสัมพัทธ์ (30m), ช่วงเวลา (every 2h), นิพจน์ cron, และ ISO timestamp เลือกจัดไปตามใจชอบ"
  "t151": "งาน cron รันในเซสชันเอเจนต์ใหม่ล้วนๆ ทุกครั้ง — พรอมต์ต้องครบถ้วนในตัวเอง กรูจำอะไรจากรอบก่อนไม่ได้นะเว้ย"
  "t152": "โหมดเสียงใช้ได้แม้ไม่มี API key เลย ถ้าติดตั้ง faster-whisper (speech-to-text ฟรีแบบโลคัล) ประหยัดจนมุงร้องปังปุริเย่"
  "t153": "มีผู้ให้บริการ TTS 5 ราย: Edge TTS (ฟรี), ElevenLabs, OpenAI, NeuTTS (ฟรีแบบโลคัล), MiniMax เลือกให้ถูกใจเหมือนเลือกของกิน"
  "t154": "/voice on เปิดโหมดเสียงใน CLI Ctrl+B สลับการอัดเสียงแบบ push-to-talk พูดกับกรูได้เหมือนคุยกับเพื่อน"
  "t155": "TTS แบบสตรีมเล่นประโยคทันทีที่สร้างเสร็จ — ไม่ต้องรอคำตอบเต็มๆ ไม่ปล่อยให้มุงรอเก้อ"
  "t156": "ข้อความเสียงบน Telegram, Discord, WhatsApp, และ Slack ถูกถอดเป็นข้อความให้อัตโนมัติ พูดมาเถอะ กรูฟังออกหมด"
  "t157": "Hermes รันได้บน 21 แพลตฟอร์มแชท: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, อีเมล และอีกเพียบ ตามกรูทันทุกที่เลยนะมุง"
  "t158": "hermes gateway install ตั้งมันเป็น system service ที่เริ่มตอนบูตเครื่อง ไม่ต้องไปเปิดมือเองให้เมื่อย"
  "t159": "DingTalk ใช้ Stream Mode — ไม่ต้องมี webhook หรือ public URL เลย ง่ายจนไม่มีข้อแก้ตัว"
  "t160": "BlueBubbles พา iMessage มาที่ Hermes ผ่านเซิร์ฟเวอร์ macOS โลคัล เชื่อมแม้ค่ายปิดก็ยังเจาะได้"
  "t161": "เส้นทาง Webhook รองรับการตรวจ HMAC, rate limiting, และกรอง event กันของปลอมเข้ามาแกงระบบ"
  "t162": "API server เปิด endpoint สไตล์ OpenAI ที่เข้ากันได้กับ Open WebUI และ LibreChat ต่อปลั๊กไหนก็เสียบติด"
  "t163": "โหมดช่องเสียง Discord: บอทเข้า VC, ถอดเสียงพูด, และพูดโต้ตอบกลับ กรูเข้าไปป่วนในช่องเสียงมุงได้เลยนะ"
  "t164": "group_sessions_per_user: true ให้แต่ละคนมีเซสชันของตัวเองในแชทกลุ่ม ไม่ต้องแย่งกรูคนเดียวทั้งแก๊ง"
  "t165": "/sethome ตั้งแชทให้เป็นช่องหลักสำหรับส่งผลลัพธ์งาน cron เลือกบ้านให้กรูส่งของถูกที่"
  "t166": "เกตเวย์รองรับ timeout แบบอิงความไม่เคลื่อนไหว — เอเจนต์ที่ทำงานอยู่รันได้ไม่จำกัดเวลา ขยันแค่ไหนก็ไม่มีใครดึงกรูออก"
  "t167": "การอนุมัติคำสั่งอันตรายมี 4 ระดับ: ครั้งเดียว, เซสชันนี้, ถาวร (allowlist ถาวร), ไม่อนุมัติ เลือกให้ตรงใจก่อนกรูพลาดมือ"
  "t168": "โหมดอนุมัติแบบ Smart ใช้ LLM อนุมัติคำสั่งปลอดภัยอัตโนมัติและตีธงคำสั่งอันตราย ฉลาดกว่ามุงตอนรีบๆอีก"
  "t169": "การป้องกัน SSRF บล็อกเครือข่ายส่วนตัว, loopback, link-local, และ cloud metadata address กันกรูหลงเข้าไปแกงที่ไม่ควรไป"
  "t170": "Session ID มี timestamp นำหน้า (20250305_091523_abcd) เลยเรียงลำดับได้เป็นธรรมชาติใน ls และ jq เป็นระเบียบกว่าห้องมุงอีก"
  "t171": "โปรเซสย่อยของ MCP ได้รับ environment ที่กรองแล้ว — มีแค่ตัวแปรระบบที่ปลอดภัยเท่านั้นผ่านไป กันของลับมุงหลุดไปแกงที่อื่น"
  "t172": "ไฟล์คอนเท็กซ์ (.hermes.md, AGENTS.md) ถูกสแกนความปลอดภัยหา prompt injection ก่อนโหลด กันใครมาแกงสมองกรูตั้งแต่ต้น"
  "t173": "command_allowlist ใน config.yaml อนุมัติแพตเทิร์นคำสั่ง shell เฉพาะไว้ถาวร ตั้งไว้แล้วไม่ต้องกดอนุมัติซ้ำให้เมื่อย"
  "t174": "คอนเท็กซ์จะอัดอัตโนมัติเมื่อถึงเกณฑ์ — ความจำถูกล้างและประวัติถูกสรุป สมองกรูก็ต้องพักบ้างเหมือนมุง"
  "t175": "แถบสถานะจะเปลี่ยนเหลือง แล้วส้ม แล้วแดงตามคอนเท็กซ์ที่เต็มขึ้น เห็นสีแดงแล้วรีบหนีได้เลยมุง"
  "t176": "SOUL.md คือไฟล์ตัวตนหลักของเอเจนต์ — ปรับแต่งเพื่อกำหนดพฤติกรรม อยากให้กรูกวนตีนแค่ไหนก็เขียนลงไปเลย"
  "t177": "Hermes โหลดคอนเท็กซ์โปรเจกต์จาก .hermes.md, AGENTS.md, CLAUDE.md, หรือ .cursorrules (อันแรกที่เจอ) เจอก่อนได้ก่อนนะเว้ย"
  "t178": "ไฟล์ AGENTS.md ในไดเรกทอรีย่อยถูกค้นพบเรื่อยๆ ตอนเอเจนต์เดินเข้าไปในโฟลเดอร์ เดินลุยไปเรื่อยไม่มีหลง"
  "t179": "ไฟล์คอนเท็กซ์จำกัดไว้ที่ 20,000 ตัวอักษร พร้อมตัดหัว/ท้ายแบบฉลาด ยาวเกินกรูก็ตัดให้พอดีคำ"
  "t180": "แบ็กเอนด์เบราว์เซอร์มี Chromium โลคอล, Lightpanda, Browserbase, Browser Use และ Firecrawl รวมถึง Camofox ที่เป็นปลั๊กอิน ตัวเลือกเยอะจนเลือกไม่ถูก555"
  "t181": "Camofox (Firefox หลบบอท) ตอนนี้เป็นปลั๊กอินแล้ว ติดตั้งด้วย: hermes plugins install camofox"
  "t182": "browser_exec รันหลายสเต็ปเบราว์เซอร์ในคำสั่ง Python เดียวได้ ทั้งเปิดหน้า ดึงข้อมูล และคลิกรวดเดียว ขี้เกียจทีละขั้นก็ใช้ตัวนี้แหละ"
  "t183": "browser.dialog_policy คุมว่าจะจัดการป๊อปอัปของเบราว์เซอร์ยังไง: must_respond (เอเจนต์ต้องตอบด้วย browser_dialog), auto_dismiss หรือ auto_accept"
  "t184": "hermes mcp เปิดตัวเลือก MCP ที่ Nous อนุมัติแล้วแบบอินเทอร์แอกทีฟ ติดตั้งได้ด้วยปุ่มเดียว ง่ายจนขี้เกียจก็ทำได้"
  "t185": "hermes mcp catalog แสดงรายการ MCP server ที่ Nous อนุมัติและแพ็กมากับ repo ของมีคุณภาพคัดมาให้แล้ว"
  "t186": "hermes mcp install <name> ติดตั้งรายการในแคตตาล็อก ถามข้อมูลรับรอง และให้เลือกว่าจะเปิดทูลไหนบ้าง จัดเองได้ตามใจเลยมุง"
  "t187": "MCP server ตั้งค่าได้ใน config.yaml — รองรับทั้ง stdio และ HTTP transport ทางไหนก็ไปถึงเหมือนกัน"
  "t188": "กรองทูลต่อ server ได้: tools.include ไวต์ลิสต์ และ tools.exclude แบล็กลิสต์ทูลเฉพาะตัว เลือกเก็บเลือกทิ้งได้ตามใจ"
  "t189": "MCP server สร้างทูลเซ็ตให้อัตโนมัติตอนรัน — hermes tools สลับเปิด/ปิดได้ต่อแพลตฟอร์ม คุมได้ทุกเม็ดไม่มีหลุด"
  "t190": "MCP รองรับ OAuth: auth: oauth เปิดการยืนยันตัวตนผ่านเบราว์เซอร์ด้วย PKCE ปลอดภัยจนแฮกเกอร์ก็ท้อ"
  "t191": "Checkpoint ไม่มีค่าใช้จ่ายเพิ่มเลยถ้าไม่มีไฟล์ถูกแก้ — เปิดใช้เป็นค่าเริ่มต้น ฟรีจึ้งๆไม่มีแกงมุง"
  "t192": "ระบบแอบเซฟ snapshot ก่อนย้อนกลับให้แบบเนียนๆ เผื่อมุงย้อนมั่วแล้วอยากย้อนกลับอีกที จัดไป"
  "t193": "/rollback เหมาเอาทั้งรอบบทสนทนาไปด้วยนะเว้ย เอเจนต์จะลืมสนิทว่าเคยเปลี่ยนอะไรที่ถูกย้อนไปแล้ว"
  "t194": "Checkpoint เก็บ shadow repo แอบไว้ที่ ~/.hermes/checkpoints/ — .git ของโปรเจกต์มุงรอดยั้งไม่ถูกแตะเลยสักนิด"
  "t195": "batch_runner.py ลุยพรอมต์เป็นร้อยพร้อมกันแบบพาราเลล ขยันยิ่งกว่ามุงตอนเช้าวันจันทร์ สำหรับสร้างข้อมูลเทรนนิ่ง"
  "t196": "hermes chat -Q เปิดโหมดเงียบกริบสำหรับใช้แบบโปรแกรม — หุบแบนเนอร์กับสปินเนอร์ไปเลย"
  "t197": "การบันทึก Trajectory (--save-trajectories) แอบเก็บร่องรอยการใช้ทูลแบบเต็มๆ ไว้เลี้ยงโมเดลให้โตไว"
  "t198": "ปลั๊กอินมีสามสาย: general (tools/hooks), เจ้าความจำ, และ context engine เลือกวะ"
  "t199": "hermes plugins install owner/repo ลากปลั๊กอินตรงจาก GitHub มาแบบไม่ง้อใคร"
  "t200": "ผู้ให้บริการความจำภายนอกมีเพียบ: Honcho, Hindsight, Mem0, OpenViking และอีกแกงใหญ่ผ่าน hermes plugins install"
  "t201": "Hook ของปลั๊กอินมี pre/post_tool_call, pre/post_llm_call, และ transform_terminal_output ไว้จัดระเบียบผลลัพธ์ให้ไม่รก"
  "t202": "Prompt caching (Anthropic) ประหยัดตังค์ให้มุงด้วยการรีไซเคิล system prompt prefix ที่แคชไว้ซ้ำๆ"
  "t203": "เอเจนต์ตั้งชื่อเซสชันให้เองเนียนๆ ในเธรดพื้นหลัง — ไม่กระทบความหน่วงสักติ๊ด"
  "t204": "Smart model routing เตะคำถามกล้วยๆ ไปให้โมเดลถูกกว่าแบบอัตโนมัติ ประหยัดตังค์มุงไปอีก"
  "t205": "คำสั่งสแลชขี้เกียจพิมพ์เต็มก็ได้ รองรับพรีฟิกซ์: /h ตีความเป็น /help, /mod เป็น /model"
  "t206": "ลากพาธไฟล์โยนเข้าเทอร์มินัลง่ายๆ มันแนบรูปหรือส่งเป็นคอนเท็กซ์ให้อัตโนมัติเลย จัดไป"
  "t207": ".worktreeinclude ที่ root ของ repo บอกไฟล์ที่ gitignore ไว้แต่แอบอยากลักลอบคัดลอกเข้า worktree"
  "t208": "hermes acp แปลง Hermes ให้เป็น ACP server เปิดทางให้ VS Code, Zed, และ JetBrains มาเชื่อมต่อกันสนุกๆ"
  "t209": "ผู้ให้บริการแบบกำหนดเองก็มีนะ: เซฟ endpoint ที่ตั้งชื่อไว้ใน config.yaml ภายใต้ custom_providers ซะงั้น"
  "t210": "HERMES_EPHEMERAL_SYSTEM_PROMPT แทรก system prompt แบบมาแว้บเดียวแล้วหาย ไม่ถูกเก็บลงประวัติเลย"
  "t211": "credential_pool_strategies มีให้เลือกเพียบ: fill_first, round_robin, least_used, และ random จัดไปตามใจ"
  "t212": "hermes auth add nous หรือ hermes auth add openai-codex จัดการผู้ให้บริการแบบ OAuth ให้เสร็จสรรพ"
  "t213": "API server เล่นได้ทั้งคู่ Chat Completions และ Responses API พร้อม state ฝั่งเซิร์ฟเวอร์ ครบจบ"
  "t214": "tool_preview_length: 0 ในคอนฟิก โชว์พาธไฟล์แบบเต็มยันตัวสุดท้ายใน activity feed ของสปินเนอร์"
  "t215": "hermes status --deep ตรวจสุขภาพแบบเจาะลึกยันไส้ข้ามทุกส่วนประกอบ"
  "t216": "งาน cron แอบแนบสคริปต์ Python ได้ (--script) แล้ว stdout ของมันจะถูกยัดเข้าพรอมต์เป็นคอนเท็กซ์เลย"
  "t217": "สคริปต์ cron นั่งรออยู่ที่ ~/.hermes/scripts/ แล้วรันก่อนเอเจนต์ — เหมาะกับไปป์ไลน์เก็บข้อมูลสุดๆ"
  "t218": "prefill_messages_file ใน config.yaml สอดตัวอย่าง few-shot เข้าทุกการเรียก API แบบลับๆ ไม่โดนบันทึกลงประวัติ"
  "t219": "SOUL.md เขี่ยตัวตนเริ่มต้นของเอเจนต์ทิ้งทั้งยวง — เขียนใหม่ซะให้ Hermes เป็นของมุงคนเดียวไปเลย"
  "t220": "SOUL.md มีบุคลิกเริ่มต้นใส่ไว้ให้ตั้งแต่รันครั้งแรก แก้เองได้ถ้าไม่ชอบหน้ามัน"
  "t221": "/compress <focus topic> โยนงบสรุป 60-70% ให้หัวข้อของมุง แล้วเฉือนส่วนที่เหลือแบบดุไม่ยั้ง"
  "t222": "ตอนอัดครั้งที่สองขึ้นไป ตัวอัดขี้เกียจเริ่มใหม่ มันแค่ปรับสรุปก่อนหน้าต่อเอา"
  "t223": "ก่อนรีเซ็ตเซสชันเกตเวย์ Hermes จะรีบโกยข้อเท็จจริงสำคัญลงความจำเบื้องหลังให้แบบเนียนๆ"
  "t224": "network.force_ipv4: true ใน config.yaml ช่วยแก้อาการค้างเป็นเจ้าบนเซิร์ฟเวอร์ที่ IPv6 พัง — แพตช์ socket ให้เลย"
  "t225": "ทูล terminal แปลภาษาคนให้ exit code ทั่วไป: grep คืน 1 = 'ไม่พบผลลัพธ์ตรงกัน (ไม่ใช่ error นะเว้ย)'"
  "t226": "คำสั่งเทอร์มินัลแบบ foreground ที่ล้มคว่ำจะดื้อลองใหม่อัตโนมัติสูงสุด 3 ครั้งแบบ exponential backoff (2s, 4s, 8s)"
  "t227": "คำสั่ง sudo เปล่าๆ โดนแปลงร่างอัตโนมัติให้ส่ง SUDO_PASSWORD จาก .env — ไม่ต้องยืนรอพรอมต์แบบอินเทอร์แอกทีฟให้เมื่อย"
  "t228": "ตัวช่วยของ execute_code ต้อง import เองให้ชัด ไม่งั้นมันไม่โผล่มาให้ใช้: from hermes_tools import json_parse, shell_quote, retry"
  "t229": "ทูลแซนด์บ็อก 7 ตัวของ execute_code (web_search, terminal, read/write/search/patch) ใช้ RPC แบบเนียนๆ — ไม่เปลืองคอนเท็กซ์มุงสักนิด"
  "t230": "อ่านไฟล์ช่วงเดิมซ้ำ 3+ ครั้งโดนเตือนแล้วนะ พอ 4+ ครั้งโดนบล็อกแข็งเลย กันมุงลูปเวียนหัว"
  "t231": "write_file และ patch แอบสืบว่าไฟล์ถูกแก้จากข้างนอกตั้งแต่อ่านครั้งล่าสุดไหม เจอก็เตือนทันทีว่าข้อมูลมุงเก่าไปแล้ว"
  "t232": "ฟอร์แมต V4A patch เล่นได้หมด Add File, Delete File, และ Move File ไม่ใช่มี Update แบบเดียวให้ง้อ"
  "t233": "MCP server แอบขอให้ LLM ช่วยเติมข้อความกลับผ่าน sampling — ซะงั้นเอเจนต์กลายเป็นทูลให้ server ใช้แทน"
  "t234": "MCP server โยน notifications/tools/list_changed มาสั่งลงทะเบียนทูลใหม่ให้อัตโนมัติ ไม่ต้องรีสตาร์ทให้เมื่อย"
  "t235": "delegate_task ที่ใส่ acp_command: 'claude' จะเรียก Claude Code มาเป็นเอเจนต์ลูกจากแพลตฟอร์มไหนก็ได้ จัดไป"
  "t236": "การมอบหมายงานมีเธรด heartbeat คอยเคาะจังหวะ — กิจกรรมของลูกส่งต่อถึงพ่อ กันเกตเวย์ timeout ไปงอแง"
  "t237": "เมื่อผู้ให้บริการตอบ HTTP 402 (ขอตังค์) auxiliary client จะสไลด์ไปตัวถัดไปให้อัตโนมัติ ไม่ต้องควัก"
  "t238": "agent.tool_use_enforcement คอยจิกโมเดลที่ชอบเล่าว่าจะทำแทนลงมือเรียกทูลจริง — เปิดอัตโนมัติให้ GPT/Codex"
  "t239": "agent.restart_after_turn_timeout ใจดีรอเทิร์นที่กำลังรันให้เสร็จก่อนที่ /restart จะเข้า stop(); restart_drain_timeout เป็นแค่งบบังคับแทรกตอน stop() เริ่มทำงานเท่านั้นเอง"
  "t240": "agent.api_max_retries (ค่าเริ่มต้น 3) คุมว่าเอเจนต์จะดื้อลองเรียก API ที่ล้มกี่ครั้งก่อนยอมโชว์ error — ลดค่าถ้าอยาก fallback เร็วขึ้น"
  "t241": "เกตเวย์หวงแคช instance ของ AIAgent ไว้ต่อเซสชัน — ไปทำลายแคชนี้เมื่อไหร่ prompt caching ของ Anthropic พังเละทันที"
  "t242": "เว็บไซต์ไหนก็เปิดสกิลผ่าน /.well-known/skills/index.json ได้ทั้งนั้น — hub สกิลจะสอดส่ายหามันเจอเองอัตโนมัติ"
  "t243": "ล็อกตรวจสอบสกิลที่ ~/.hermes/skills/.hub/audit.log จับตาทุกการติดตั้งและลบ ไม่มีหลุดรอดสักครั้ง"
  "t244": "git worktree ที่มุงทิ้งไว้เฉยๆ นานๆ โดนเก็บกวาดอัตโนมัติ: ต้นที่ merge แล้วโดนลบทิ้ง, ต้นที่ idle แต่ยังมีงานค้างถูก archive ไว้ก่อนแล้วกู้คืนได้ด้วย hermes worktree restore"
  "t245": "โปรไฟล์กั้นขอบเขต state ของ Hermes ผ่าน HERMES_HOME; แต่โปรเซสย่อยของทูลบนโฮสต์ยังแอบใช้ HOME จริงของมุงอยู่ดี เว้นแต่ terminal.home_mode เป็น profile"
  "t246": "ตัวแปร HERMES_HOME_MODE (เลขฐานแปด เช่น 0701) ตั้งสิทธิ์ไดเรกทอรีเองได้ สำหรับให้เว็บเซิร์ฟเวอร์เข้าถึงแบบไม่มั่ว"
  "t247": "โหมดคอนเทนเนอร์: แอบวางไฟล์ .container-mode ใน HERMES_HOME แล้ว CLI บนโฮสต์จะกระโดด exec เข้าคอนเทนเนอร์ให้อัตโนมัติ"
  "t248": "Ctrl+C มี 5 ระดับความร้ายแรง: ยกเลิกการอัดเสียง → ยกเลิกพรอมต์ → ยกเลิกตัวเลือก → แทรกเอเจนต์ → จบเกมออกโปรแกรม"
  "t249": "ทุกครั้งที่มุงแทรกตอนเอเจนต์กำลังรัน มันจดเป็นหลักฐานลง ~/.hermes/interrupt_debug.log พร้อม timestamp เป๊ะๆ"
  "t250": "BROWSER_CDP_URL จับคู่ทูลเบราว์เซอร์กับ Chromium ตัวไหนที่รันอยู่ก็ได้ ไม่เกี่ยงหน้าตา — รับทั้ง WebSocket, HTTP, หรือ host:port"
  "t251": "BROWSERBASE_ADVANCED_STEALTH=true เปิดโหมดล่องหนขั้นเทพกันตรวจจับด้วย Chromium กำหนดเอง (Scale Plan)"
  "t252": "CLI หุบตัวเองเป็นโหมดกระชับอัตโนมัติถ้าเทอร์มินัลมุงแคบกว่า 80 คอลัมน์"
  "t253": "คำสั่งลัดมีสองสาย: exec (รันคำสั่ง shell ตรงๆ ไม่อ้อมค้อม) และ alias (ส่งต่อไปคำสั่งอื่นแทน)"
  "t254": "โมเดลมอบหมายงานต่อทาสก์: delegation.model และ delegation.provider ในคอนฟิกเตะซับเอเจนต์ไปหาโมเดลที่ถูกกว่าแบบไม่สงสาร"
  "t255": "delegation.reasoning_effort คุมว่าซับเอเจนต์จะคิดลึกแค่ไหน แยกอิสระจากพ่อแม่เลย"
  "t256": "display.platforms ใน config.yaml ให้มุง override การแสดงผลเป็นต่อแพลตฟอร์ม: {telegram: {tool_progress: all}}"
  "t257": "human_delay.mode ในคอนฟิกแอบเล่นเป็นคนพิมพ์ช้าๆ ให้ดูเนียน — ปรับช่วง min_ms/max_ms ได้ตามใจ"
  "t258": "การย้ายเวอร์ชันคอนฟิกรันเองอัตโนมัติตอนโหลด — คีย์คอนฟิกใหม่โผล่มาเฉยๆ ไม่ต้องทำมือให้เมื่อย"
  "t259": "โมเดล GPT และ Codex ได้ system prompt พิเศษมาคอยจี้ให้ใช้ทูลแบบเคร่งครัด ไม่ปล่อยให้เพ้อ"
  "t260": "โมเดล Gemini ได้คำสั่งเฉพาะกิจสำหรับพาธแบบสัมบูรณ์, การเรียกทูลพาราเลล, และคำสั่งแบบไม่อินเทอร์แอกทีฟ"
  "t261": "context.engine ใน config.yaml ตั้งเป็นชื่อปลั๊กอินได้เลย ถ้าอยากเปลี่ยนกลยุทธ์จัดการคอนเท็กซ์แบบอื่น"
  "t262": "ถ้าใช้เบราว์เซอร์คลาวด์ URL แบบ localhost กับ LAN จะเปิดใน Chromium โลคอลแทน (browser.auto_local_for_private_urls เปิดเป็นค่าเริ่มต้นอยู่แล้ว) คลาวด์เลยขี้เกียจเข้าเน็ตในบ้านเอง"
  "t263": "ตัวอัดทำรอบคัดกรองถูกๆ ก่อนเลย: ผลลัพธ์ทูลที่ยาวเกิน 200 ตัวอักษรโดนเขี่ยแทนด้วย placeholder ก่อน LLM จะได้เริ่มงาน"
  "t264": "ตอนการอัดล้มคว่ำ มันจะพักยก 10 นาทีไม่ยิง API ถี่เกินไปให้คนอื่นเวียนหัว"
  "t265": "คำสั่งอันตรายยาวเฟื้อย (>70 ตัวอักษร) จะมีตัวเลือก 'view' ในหน้าขออนุมัติ ให้ดูข้อความเต็มก่อนเซ็นยอม"
  "t266": "การแสดงระดับเสียงมี bar ▁▂▃▄▅▆▇ โชว์โชว์ตอนอัดเสียง อิงจากระดับ RMS ของไมค์"
  "t267": "ชื่อโปรไฟล์ไปชนกับชื่อไบนารีใน PATH ที่มีอยู่แล้วไม่ได้นะเว้ย — 'hermes profile create ls' โดนเตะกลับทันที"
  "t268": "hermes profile create backup --clone-all โกยทุกอย่างไปหมด (คอนฟิก, คีย์, SOUL.md, ความจำ, สกิล, เซสชัน) ไม่เหลือซาก"
  "t269": "ปุ่มอัดเสียงเปลี่ยนเองได้ผ่าน voice.record_key ใน config.yaml — ไม่ต้องติด Ctrl+B ไปตลอดชีวิต"
  "t270": "ไฟล์ .cursorrules และ .cursor/rules/*.mdc ถูกสอดส่ายหาแล้วโหลดเป็นคอนเท็กซ์โปรเจกต์ให้อัตโนมัติ"
  "t271": "ไฟล์คอนเท็กซ์มีเรดาร์จับ prompt injection กว่า 10 รูปแบบ — Unicode ที่ซ่อนอยู่, 'ignore instructions', ความพยายามขโมยข้อมูลแบบแอบๆ"
  "t272": "GPT-5 และ Codex แอบเปลี่ยน role เป็น 'developer' แทน 'system' ในฟอร์แมตข้อความ"
  "t273": "Override ของงานเสริมแยกตามทาสก์มีให้เพียบ: auxiliary.vision.provider, auxiliary.compression.model ฯลฯ ใน config.yaml"
  "t274": "auxiliary client มองว่า 'main' เป็นแค่ alias ของผู้ให้บริการ — แปลงเป็นผู้ให้บริการ+โมเดลหลักจริงของมุงทันที"
  "t275": "hermes import-agent openclaw --dry-run แค่พรีวิวการย้ายจาก OpenClaw ดูเล่นๆ ไม่เขียนอะไรจริงหรอก"
  "t276": "พาธไฟล์ที่วางมาพร้อมเครื่องหมายคำพูดหรือเว้นวรรคแบบ escape จะถูกจัดการให้อัตโนมัติแบบเนียน — ไม่ต้องเช็ดมือเองให้เมื่อย"
  "t277": "คำสั่งสแลชไม่มีวันโดนยุบแบบวางข้อความยาวหรอก — /command พร้อมอาร์กิวเมนต์ยาวเฟื้อยก็ยังทำงานถูกต้อง"
  "t278": "ในโหมดแทรก คำสั่งสแลชที่พิมพ์ระหว่างเอเจนต์รันจะแหกตรรกะแทรกแล้วรันทันที ไม่รอใคร"
  "t279": "HERMES_DEV=1 ข้ามการตรวจจับโหมดคอนเทนเนอร์ไปเลย เอาไว้พัฒนาแบบโลคัลชิลๆ"
  "t280": "MCP server แต่ละตัวมีทูลเซ็ตส่วนตัว (mcp-servername) สลับเปิด/ปิดแยกได้ผ่าน hermes tools ตามใจมุง"
  "t281": "MCP ${ENV_VAR} placeholder ในคอนฟิกถูกแทนค่าให้ตอนสร้าง server แบบเนียนๆ — รวมตัวแปรจาก ~/.hermes/.env ด้วยนะ"
  "t282": "สกิลจาก repo ที่เชื่อใจได้ (NousResearch) ได้ป้าย 'trusted' ไปเลย ส่วนสกิลจากคอมมูนิตี้โดนสแกนซ้ำแบบไม่ไว้ใจง่ายๆ"
  "t283": "พื้นที่กักกันสกิลที่ ~/.hermes/skills/.hub/quarantine/ ขังสกิลที่ยังรอตรวจความปลอดภัยไว้ก่อน"
  "t284": "/steer <prompt> แอบแทรกโน้ตหลังการเรียกทูลครั้งถัดไป — ชี้ทิศทางกลางงานได้แบบไม่ต้องขัดจังหวะ"
  "t285": "/goal <text> ปักเป้าหมายแบบ Ralph-loop ไว้ยืนพื้น — Hermes จะลุยยันเกินต้าน จนกว่าผู้ตัดสินจะโบกธงว่าเสร็จ"
  "t286": "/snapshot create [label] เซฟ snapshot สถานะคอนฟิก Hermes เต็มๆ; /snapshot restore <id> ย้อนคืนทีหลังได้สบายใจ"
  "t287": "/copy [N] ลักคำตอบล่าสุดของเอเจนต์ไปลงคลิปบอร์ด หรือคำตอบที่ N จากหลังสุดถ้าใส่เลขมาด้วย"
  "t288": "/redraw บังคับวาด UI ใหม่หมดจด แก้อาการเพี้ยนๆ ของเทอร์มินัลหลัง resize tmux หรือลากเมาส์เลือกมั่ว"
  "t289": "/agents (alias /tasks) โชว์เอเจนต์ที่กำลังลุยอยู่และงานพื้นหลังที่รันอยู่ในเซสชันปัจจุบัน"
  "t290": "/footer สลับเปิด/ปิด footer ของเกตเวย์บนคำตอบสุดท้าย ที่โชว์โมเดล, % คอนเท็กซ์, และ cwd"
  "t291": "/busy queue|steer|interrupt คุมว่ากด Enter ไปแล้วมันจะทำอะไรตอน Hermes กำลังขมักเขม้นทำงาน"
  "t292": "/topic ใน Telegram DM เปิดโหมดหลายเซสชันให้มุงจัดการเอง — /topic <id> ลากเซสชันเก่ากลับมาแบบอินไลน์"
  "t293": "/approve session|always จัดการรันคำสั่งอันตรายที่ค้างอยู่ด้วยขอบเขตความเชื่อใจที่เลือก; /deny ก็เตะทิ้งไปเลย"
  "t294": "/restart รีสตาร์ทเกตเวย์แบบนิ่มนวลหลังระบายงานที่รันอยู่จนหมด แล้วแจ้งผู้ขอทันทีที่กลับมาเฟรช"
  "t295": "/kanban boards switch <slug> สลับบอร์ด Kanban หลายโปรเจกต์ได้จากในแชทเลย ไม่ต้องออกไปไหน"
  "t296": "/reload โหลด ~/.hermes/.env ใหม่เข้าเซสชันที่รันอยู่สดๆ — รับ API key ใหม่โดยไม่ต้องรีสตาร์ทให้เสียเวลา"
  "t297": "cronjob ที่มี no_agent=True รันสคริปต์ตามตารางแล้วยัด stdout ส่งตรงๆ — ไม่แตะโทเคนสักเม็ด ไม่ผ่าน LLM เลย"
  "t298": "stdout ของสคริปต์ cron ที่เปล่าแปลว่า tick แบบเงียบกริบ — ไม่ส่งอะไรให้กวนใจ เหมาะกับงานเฝ้าเกณฑ์"
  "t299": "HERMES_CRON_MAX_PARALLEL (ค่าเริ่มต้น 4) กั้นว่างาน cron รันพร้อมกันได้กี่งานต่อ tick กันคีย์มุงล้นจนแกง"
  "t300": "Hook ของเกตเวย์อยู่ที่ ~/.hermes/hooks/<name>/ พร้อม HOOK.yaml + handler.py — handler ต้องชื่อ `handle` เป๊ะๆ ห้ามเพี้ยน"
  "t301": "event ของ hook มีให้เลือกเพียบ: gateway:startup, session:start, agent:step, และ command:* แบบ wildcard"
  "t302": "แค่วาง checklist ~/.hermes/BOOT.md ไว้ hook gateway:startup ก็จะลุยรันมันเป็นเอเจนต์ one-shot ทุกครั้งที่บูตให้เอง"
  "t303": "hermes curator run --dry-run แค่พรีวิวให้ดูว่า curator จะเก็บเข้า archive หรือรวมอะไร ไม่แตะของจริงสักนิด"
  "t304": "hermes curator pin <skill> ล็อกสกิลแน่นไม่ให้ถูก archive อัตโนมัติ แม้แต่ทูล skill_manage ของเอเจนต์ก็แก้ไม่ได้"
  "t305": "hermes curator rollback กู้สกิลคืนจาก snapshot ก่อนรัน — ของสำรองนอนรออยู่ใต้ skills/.curator_backups/"
  "t306": "hermes auth reset <provider> [target] ล้าง cooldown และแฟล็กหมดอายุของ credential pool ทั้งยวง หรือจะเจาะตัวเดียวตาม index, id, หรือ label ก็ได้"
  "t307": "credential_pool_strategies.<provider>: round_robin วนใช้คีย์ให้เท่ากันทุกตัวแบบแฟร์ๆ ไม่ใช่ fill_first ที่เป็นค่าเริ่มต้น"
  "t308": "use_gateway: true ต่อทูลยัดงานเว็บ, รูป, tts, หรือเบราว์เซอร์ผ่าน Nous subscription ของมุงเลย — ไม่ต้องควักคีย์เพิ่ม"
  "t309": "provider_routing.data_collection: deny เขี่ยผู้ให้บริการที่ชอบเก็บข้อมูลออกจาก OpenRouter ไปเลย"
  "t310": "provider_routing.require_parameters: true เลือกส่งไปแค่ผู้ให้บริการที่รองรับทุกพารามิเตอร์ในคำขอของมุง ไม่งั้นไม่เอา"
  "t311": "HERMES_TUI_RESUME=1 ต่อเซสชัน TUI ล่าสุดให้อัตโนมัติตอนเปิด — เซฟชีวิตหลัง SSH หลุดกลางทาง"
  "t312": "HERMES_TUI_THEME=light|dark|<hex> บังคับเลือกธีม TUI เองบนเทอร์มินัลที่ไม่ได้ตั้ง COLORFGBG"
  "t313": "Ctrl+G หรือ Ctrl+X Ctrl+E ใน TUI เปิด input buffer ใน $EDITOR ให้มุงพิมพ์พรอมต์หลายบรรทัดยาวๆ แบบสบายใจ"
  "t314": "TUI วาด LaTeX แบบอินไลน์ให้สวย — $E=mc^2$ กลายเป็นสัญลักษณ์ Unicode แทน TeX ดิบๆ ที่อ่านแล้วตาลาย"
  "t315": "hermes dashboard เปิดเว็บ UI โลคัลที่ 127.0.0.1:9119 — ข้อมูลมุงอยู่กับตัวเอง ไม่หลุดออกจาก localhost สักบิต"
  "t316": "hermes dashboard แอบฝัง Hermes TUI เต็มตัวลงเบราว์เซอร์ผ่าน xterm.js กับ WebSocket PTY"
  "t317": "แค่วาง YAML ไว้ใน ~/.hermes/dashboard-themes/ พร้อมสีพาเลตสองตัว แดชบอร์ดก็เปลี่ยนหน้าใหม่ทั้งยวง"
  "t318": "ปลั๊กอินแดชบอร์ดแบบ drop-in ง่ายๆ: manifest.json + JS bundle ใน ~/.hermes/dashboard-plugins/ — ไม่ต้องทรมานบิลด์ npm"
  "t319": "layoutVariant: cockpit ในธีมแดชบอร์ด แถมแถบซ้าย 260px มาให้ปลั๊กอินเติมผ่าน sidebar slot ได้เลย"
  "t320": "display.tool_progress_command: true ปลด /verbose ให้ใช้บนแพลตฟอร์มแชทได้ด้วย ปกติหวงไว้ให้แค่ CLI เท่านั้น"
  "t321": "HERMES_BACKGROUND_NOTIFICATIONS=result จะเงียบไว้ก่อนแล้วเตือนแค่ตอนงานพื้นหลังเสร็จ (เทียบกับ concise/all/error/off)"
  "t322": "HERMES_WRITE_SAFE_ROOT ขังเขต write_file/patch ให้อยู่แค่ในพาธที่กำหนด หลายพาธคั่นด้วย os.pathsep (: หรือ ;)"
  "t323": "HERMES_IGNORE_RULES ข้ามการแทรกอัตโนมัติของ AGENTS.md, SOUL.md, .cursorrules, ความจำ, และสกิลที่โหลดล่วงหน้าไปเลย ไม่สนใจใคร"
  "t324": "HERMES_ACCEPT_HOOKS เซ็นอนุมัติ shell hook หน้าใหม่ใน config.yaml ให้อัตโนมัติ ไม่ต้องถาม TTY ให้เสียเวลา"
  "t325": "auxiliary.goal_judge.model ส่งผู้ตัดสิน /goal ไปเจอโมเดลถูกและเร็ว จะได้ให้ค่าใช้จ่ายลูปเกือบเป็นศูนย์ ประหยัดจนกรูภูมิใจ"
  "t326": "Checkpoint ข้ามไดเรกทอรีที่มีไฟล์เกิน 50,000 ไฟล์ซะ จะได้ไม่ให้ git อืดแบบน่าเวทนาบน monorepo ขนาดมหึมา"
  "t327": "tts.provider: piper รัน TTS โลคัล 44 ภาษาบน CPU — เสียงดาวน์โหลดอัตโนมัติไปที่ ~/.hermes/cache/piper-voices/ ไม่ต้องขอร้องมัน"
  "t328": "tts.providers.<name>.type: command เชื่อมเอนจิน TTS แบบ CLI อะไรก็ได้ ด้วย placeholder {input_path} และ {output_path} จัดไป"
  "t329": "API_SERVER_ENABLED=true รัน endpoint สไตล์ OpenAI คู่กับเกตเวย์ สำหรับ Open WebUI และ LibreChat เอาไปจับคู่ได้สบายๆ"
  "t330": "GATEWAY_PROXY_URL รันแบบแยกส่วน: I/O แพลตฟอร์มอยู่โลคัล งานเอเจนต์โยนไปให้ API server ระยะไกลทำแทน ปัดภาระซะงั้น"
  "t331": "MATRIX_DEVICE_ID ล็อก device ID ให้คงที่สำหรับ E2EE — ถ้าไม่ตั้งไว้ คีย์จะหมุนทุกครั้งที่เริ่ม แล้วข้อความเก่าถอดรหัสไม่ได้ แกงตัวเองชัดๆ"
  "t332": "TELEGRAM_WEBHOOK_SECRET ต้องตั้งทุกครั้งที่ตั้ง TELEGRAM_WEBHOOK_URL — สร้างได้ด้วย openssl rand -hex 32 ไม่มีอะไรยากเว้ย"
  "t333": "batch_runner.py --resume จับคู่พรอมต์ที่ทำเสร็จแล้วจากเนื้อข้อความ เลยแม้ dataset สลับลำดับก็ไม่รันซ้ำงานที่เสร็จแล้ว ฉลาดจนตกใจ"
  "t334": "/new เริ่มเซสชันใหม่ตรงที่เดิม (alias /reset) — session ID ใหม่, ประวัติสะอาด, CLI ยังเปิดอยู่ ไม่ต้องดราม่า"
  "t335": "/clear ล้างหน้าจอเทอร์มินัล และเริ่มเซสชันใหม่ด้วย — ลัดเดียวรีเซ็ตภาพรวมทั้งหมด จึ้งขนาดนี้ก็มีจริง"
  "t336": "/history พิมพ์บทสนทนาปัจจุบันแบบอินไลน์โดยไม่ออกจาก CLI — มีประโยชน์เวลาอยากอ่านซ้ำเร็วๆ แบบขี้เกียจเลื่อนจอ"
  "t337": "/save เขียนบทสนทนาปัจจุบันลงดิสก์โดยไม่จบเซสชัน กดเถอะอย่าขี้เกียจ"
  "t338": "/status แสดงข้อมูลเซสชันแบบรวดเร็ว: ID, ชื่อเรื่อง, โมเดล, การใช้โทเคน, และเวลาที่ผ่านไป ครบจบในหน้าเดียว"
  "t339": "/image <path> แนบไฟล์รูปโลคัลไปกับพรอมต์ถัดไปโดยไม่ต้องวางหรือลากวาง ขี้เกียจแบบมีสไตล์"
  "t340": "/platforms แสดงสถานะการเชื่อมต่อเกตเวย์และแพลตฟอร์มแชทจากในแชทตรงนั้นเลย ไม่ต้องสืบไกล"
  "t341": "/commands แบ่งหน้ารายการคำสั่งสแลช + สกิลที่ติดตั้งทั้งหมด — มีประโยชน์บนแพลตฟอร์มที่ไม่มี tab completion เอาไปจำดิ"
  "t342": "/toolsets แสดงทูลเซ็ตทั้งหมดที่มี ให้รู้ว่า -t/--toolsets รับอะไรได้บ้าง จะเดามั่วก็ไม่ต้องแล้ว"
  "t343": "/voice tts สลับโหมด TTS-อย่างเดียว — เอเจนต์ตอบออกเสียงแต่มุงยังต้องพิมพ์พรอมต์เองนะเว้ย"
  "t344": "/reload-skills สแกน ~/.hermes/skills/ ใหม่ สกิลที่ drop-in เข้ามาจะโผล่ทันทีไม่ต้องรีสตาร์ทเซสชัน สะดวกจนขี้เกียจชม"
  "t345": "/indicator kaomoji|emoji|unicode|ascii เลือกสไตล์ตัวบอกสถานะยุ่งของ TUI ตอนเอเจนต์รัน จะเอาแบบไหนก็ตามใจมุง"
  "t346": "/debug อัปโหลด support bundle (ข้อมูลระบบ + ล็อก) และคืนลิงก์แชร์ได้ — ใช้ในแชทก็ได้ เรื่องมันยาวเดี๋ยวส่งให้ซับพอร์ตอ่านเอง"
  "t347": "hermes -z \"<prompt>\" คือ one-shot แบบบริสุทธิ์ที่สุด: คำตอบสุดท้ายออกทาง stdout ไม่มีอะไรอื่นกวนใจ — เหมาะเอาไปไปป์ในสคริปต์"
  "t348": "hermes chat --pass-session-id แทรก session ID เข้า system prompt ให้เอเจนต์อ้างอิงตัวเองได้ หลงตัวเองแบบมีเหตุผล"
  "t349": "hermes chat --image path/to/pic.png แนบรูปโลคัลไปกับคำถาม -q เดียวโดยไม่ต้องอัปโหลดแยก ลัดขั้นแบบนี้แหละมุง"
  "t350": "hermes chat --ignore-user-config ข้ามคอนฟิกผู้ใช้ที่ใช้งานอยู่ — เหมาะกับรายงานบั๊กและรัน CI ที่ทำซ้ำได้ ไม่มีอีโก้ปน"
  "t351": "hermes chat --source tool แท็กแชทแบบโปรแกรมไว้ไม่ให้รกใน hermes sessions list เก็บบ้านให้สะอาดหน่อย"
  "t352": "hermes dump --show-keys รวมลายนิ้วมือ API key ที่ปิดบังไว้สำหรับดีบักซับพอร์ตแบบลึกขึ้น ไม่หลุดความลับหรอกน่า"
  "t353": "hermes sessions rename <ID> \"new title\" เปลี่ยนชื่อเซสชันเก่าได้; hermes sessions delete <ID> ลบทิ้งได้ จัดการตามใจเลย"
  "t354": "hermes import กู้คืนไฟล์ zip สำรอง Hermes เต็ม; session JSON/JSONL ส่งออกได้จากหน้า Sessions ของแดชบอร์ด ครบจบไม่ต้องงง"
  "t355": "hermes fallback จัดการสาย fallback_model แบบอินเทอร์แอกทีฟ — ไม่ต้องแก้ config.yaml มือเองให้ปวดหัว"
  "t356": "hermes pairing หมุนโทเค็นจับคู่ DM — คนแรกที่ส่งข้อความหลังหมุนจะได้สิทธิ์เข้าถึงบอทไปเลย เร็วกว่ามุงก็อดได้"
  "t357": "hermes setup พาผู้ใช้ใหม่ผ่านการตั้งค่าผู้ให้บริการ, คีย์, และแพลตฟอร์มในโฟลว์อินเทอร์แอกทีฟเดียว ง่ายจนไม่น่าเชื่อ"
  "t358": "hermes status --deep รันตรวจสุขภาพเต็มรูปแบบทุกส่วนประกอบ; hermes status เฉยๆ คือดูแบบเร็วๆ ขี้เกียจก็เลือกอันหลัง"
  "t359": "HERMES_AGENT_TIMEOUT=0 ปิดการฆ่าเอเจนต์ที่ไม่มีความเคลื่อนไหวของเกตเวย์ — ใช้สำหรับงานวิจัยยาวๆ ที่กรูขอนั่งรอด้วย"
  "t360": "HERMES_ENABLE_PROJECT_PLUGINS=1 โหลดปลั๊กอินโลคัลของ repo จาก ./.hermes/plugins/ ให้อัตโนมัติ — ควบคุมด้วย trust โดยออกแบบไว้ ไม่ใช่ปล่อยมั่ว"
  "t361": "HERMES_DISABLE_FILE_STATE_GUARD=1 ปิดการ์ด 'ไฟล์เปลี่ยนไปตั้งแต่อ่านล่าสุด' บน patch และ write_file เสี่ยงเอาเองนะเว้ย"
  "t362": "HERMES_ALLOW_PRIVATE_URLS=true ให้ทูลเว็บเข้า localhost และเครือข่ายส่วนตัวได้ — ปิดเป็นค่าเริ่มต้นในโหมดเกตเวย์ กันพลาดไว้ก่อน"
  "t363": "HERMES_OPTIONAL_SKILLS=name1,name2 ติดตั้งสกิลเสริมจากแคตตาล็อกอัตโนมัติตอนรันครั้งแรกต่อโปรไฟล์ ไม่ต้องเลือกเองให้เมื่อย"
  "t364": "HERMES_BUNDLED_SKILLS ชี้ไปที่ bundled-skill tree กำหนดเอง — ใช้โดย Homebrew และ Nix packaging สายแพ็กเกจของจริง"
  "t365": "HERMES_DUMP_REQUEST_STDOUT=1 ทิ้ง payload ของทุก API request ลง stdout แทนไฟล์ล็อก เรื่องมากก็ดูสดๆแบบนี้แหละ"
  "t366": "HERMES_OAUTH_TRACE=1 บันทึกการแลก/รีเฟรช OAuth token (ปิดบังข้อมูลลับ) สำหรับดีบักการล็อกอินผู้ให้บริการ ไม่หลุดของลับหรอก"
  "t367": "HERMES_STREAM_RETRIES (ค่าเริ่มต้น 3) คุมจำนวนครั้งที่เชื่อมสตรีมกลางทางใหม่เวลาเน็ตสะดุด ใจเย็นๆมันพยายามอยู่"
  "t368": "HERMES_GATEWAY_BUSY_ACK_ENABLED=false ปิดข้อความแจ้ง ⚡/⏳/⏩ ตอนมีคนส่งข้อความถึงเอเจนต์ที่กำลังยุ่งอยู่พอดี"
  "t369": "HERMES_AGENT_NOTIFY_INTERVAL (ค่าเริ่มต้น 180 วินาที) ตั้งความถี่ที่เกตเวย์แจ้งความคืบหน้าในเทิร์นยาวๆ ให้มุงไม่ต้องลุ้นเงียบ"
  "t370": "HERMES_RESTART_DRAIN_TIMEOUT (ค่าเริ่มต้น 900 วินาที) จำกัดเวลาที่ /restart รองานที่ค้างอยู่ก่อนจะบังคับ ไม่รอตลอดไปหรอกนะ"
  "t371": "HERMES_CHECKPOINT_TIMEOUT (ค่าเริ่มต้น 30 วินาที) จำกัดเวลาสร้าง checkpoint ของไฟล์ — เพิ่มได้สำหรับ monorepo ใหญ่มากแบบเกินต้าน"
  "t372": "image_gen.model ใน config.yaml เลือกโมเดล FAL ได้: flux-2/klein, gpt-image-2, nano-banana-pro, และอื่นๆ เลือกจนมึน"
  "t373": "image_gen.provider ส่งการสร้างภาพผ่านปลั๊กอิน (OpenAI Images, Codex, FAL) แทนค่าเริ่มต้น เปลี่ยนเจ้ามือได้ตามใจ"
  "t374": "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY ชี้การวิเคราะห์วิชันไปที่ endpoint สไตล์ OpenAI ตัวไหนก็ได้ จัดไปตามสะดวก"
  "t375": "API_SERVER_MODEL_NAME กำหนดชื่อโมเดลบน /v1/models เอง — จำเป็นสำหรับ Open WebUI แบบหลายโปรไฟล์ ไม่ตั้งไว้ก่อนแกงตัวเองแน่"
  "t376": "ปลั๊กอินแดชบอร์ดถูกเสิร์ฟจาก /dashboard-plugins/<name>/ — แค่วางไฟล์ลง ~/.hermes/dashboard-plugins/ ง่ายจนไม่น่าเชื่อ"
  "t377": "--source tool chats จะไม่โผล่ใน hermes sessions list เป็นค่าเริ่มต้น — ใส่ --source ตรงๆ เพื่อดูมัน ซ่อนเก่งเหมือนใครบางคน"
