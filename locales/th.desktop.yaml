"settings.fieldDescriptions.voice.autoTts": "พูดคำตอบของผู้ช่วยออกมาให้ฟังโดยอัตโนมัติ ไม่ต้องกดอะไรเพิ่ม"
"settings.fieldDescriptions.voice.gptLive.instructions": "ประโยคเสริมสำหรับบุคลิกเสียงสด (น้ำเสียง จังหวะ ภาษา) Hermes ยังคงใช้ system prompt ของตัวเองอยู่ดี"
"settings.fieldDescriptions.voice.gptLive.voice": "เสียงสำหรับโหมด GPT-Live รองรับ voice ID กำหนดเอง"
"settings.fieldDescriptions.voice.voiceChatMode": "chained: แปลงเสียงเป็นข้อความ → Hermes → แปลงข้อความเป็นเสียง ด้วย provider ด้านล่าง gpt-live: ใช้โมเดลเสียง OpenAI แบบ full-duplex ตัวเดียว (gpt-live-1) ฟังและพูดพร้อมกัน แล้วส่งทุกคำขอจริงให้ Hermes ไปจัดการ — โมเดลที่เลือกไว้จะตอบด้วยทูลเซ็ตเต็มๆ ต้องมี OpenAI API key ชั้นเสียงคิดเงิน $0.05 ต่อนาที อย่าพูดเพลินจนบิลบวม"
