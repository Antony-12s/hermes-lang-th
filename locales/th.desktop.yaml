"settings.fieldDescriptions.browser.useRealProfile": "การเปิดเว็บแบบโลคอลจะใช้ล็อกอินจริงของมุง Hermes จะคัดลอกโปรไฟล์เบราว์เซอร์เริ่มต้น (คุกกี้ ล็อกอิน การตั้งค่า) ไปเก็บเป็นสแนปช็อตที่ควบคุมได้ แล้วขับด้วย Chromium ของมันเอง — โปรไฟล์จริงของมุงจะไม่ถูกเปิดตรงๆ เด็ดขาด และสำเนาจะรีเฟรชจากต้นฉบับทุกครั้งที่รัน ยังให้เอเจนต์เปิดเซสชันโปรไฟล์จริงแบบโลคอลได้เมื่อขอ แม้ตั้งค่าใช้เบราว์เซอร์คลาวด์อยู่ก็ตาม รองรับแค่เบราว์เซอร์ตระกูล Chromium (Chrome, Edge, Brave, Brave Origin, Chromium) ถ้าเบราว์เซอร์เริ่มต้นไม่ใช่ตระกูลนี้จะพังพร้อมแจ้งเหตุผลชัดๆ ปิดไว้เป็นค่าเริ่มต้น"
"settings.fieldDescriptions.checkpoints.enabled": "สร้างสแนปช็อตย้อนกลับก่อนแก้ไฟล์ทุกครั้ง เผื่อพลาดจะได้ถอยได้"
"settings.fieldDescriptions.codeExecution.mode": "รันโค้ดถูกจำกัดให้อยู่ในขอบเขตโปรเจกต์ปัจจุบันเข้มแค่ไหน เข้มเว่อร์หรือปล่อยหลวมๆ"
"settings.fieldDescriptions.compression.codexGpt55Autoraise": "ดันอัตราบีบอัดขึ้นเป็น 85% สำหรับโมเดล ChatGPT Codex OAuth ที่รองรับ แบบไม่ต้องขอ"
"settings.fieldDescriptions.compression.enabled": "สรุปคอนเท็กซ์เก่าให้สั้นลงเมื่อบทสนทนายาวเกินไป กันความจำแอปบวม"
"settings.fieldDescriptions.context.engine": "กลยุทธ์จัดการบทสนทนายาวๆ ตอนใกล้ชนลิมิตคอนเท็กซ์ จะได้ไม่น็อกกลางทาง"
