"settings.fieldDescriptions.desktop.repoScanExcludePaths": "โฟลเดอร์ (และลูกๆ ของมัน) ที่จะข้ามตอนค้นหา repository ไม่ต้องไปยุ่งให้รำคาญ"
"settings.fieldDescriptions.desktop.repoScanRoots": "โฟลเดอร์ที่จะสแกน เว้นว่างไว้เพื่อสแกนโฮมไดเรกทอรีของมุงทั้งยวง"
"settings.fieldDescriptions.display.personality": "สไตล์ผู้ช่วยเริ่มต้นสำหรับเซสชันใหม่ เลือกมู้ดได้ตามใจ"
"settings.fieldDescriptions.display.showReasoning": "แสดงส่วนการคิด (reasoning) เมื่อแบ็กเอนด์ส่งมาให้ จะได้แอบดูว่ามันคิดอะไรอยู่"
"settings.fieldDescriptions.fallbackProviders": "รายการ provider:model สำรอง ที่จะลองใช้ถ้าโมเดลหลักล่ม กันแอปค้างเก้อ"
"settings.fieldDescriptions.fileReadMaxChars": "จำนวนอักขระสูงสุดที่ Hermes อ่านได้จากไฟล์เดียวต่อคำขอ อ่านเกินนี้ก็ตัดทิ้ง"
"settings.fieldDescriptions.memory.memoryEnabled": "บันทึกความจำแบบถาวรที่ช่วยเซสชันในอนาคตได้ จะได้ไม่ต้องเล่าซ้ำทุกครั้ง"
"settings.fieldDescriptions.memory.userProfileEnabled": "เก็บโปรไฟล์ความชอบของผู้ใช้แบบกระชับๆ เอาไว้ จะได้รู้ใจมุงมากขึ้น"
"settings.fieldDescriptions.model": "ใช้กับแชตใหม่ เว้นแต่เลือกโมเดลอื่นในช่องพิมพ์เอง"
"settings.fieldDescriptions.modelContextLength": "แทนที่ขนาดคอนเท็กซ์วินโดว์ที่ตรวจพบของโมเดลแชตหลักเท่านั้น (หน่วยโทเคน) ปล่อยไว้ที่ 0 เพื่อใช้ค่าที่ตรวจพบของโมเดลที่เลือก ไม่กระทบโมเดลเสริม/MoA"
"settings.fieldDescriptions.security.redactSecrets": "ซ่อนข้อมูลลับที่ตรวจพบจากเนื้อหาที่โมเดลมองเห็น ถ้าทำได้"
"settings.fieldDescriptions.stt.echoTranscripts": "โพสต์บทถอดเสียง \U0001F399️ ดิบๆ ของข้อความเสียงกลับเข้าแชต ให้เห็นกันจะๆ"
